kind = "web"
previewPath = "/"
title = "Flight Ticket Generator"
description = "Flight Ticket Generator helps you prepare flight confirmation documents with airport-aware itineraries, traveler and payment details, and PDF or PNG exports. Drafts save in your browser; bookings and payments are not processed."
version = "1.0.0"
id = "artifacts/flight-ticket-generator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22365

[services.development]
run = "pnpm --filter @workspace/flight-ticket-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flight-ticket-generator", "run", "build" ]
serve = "static"
publicDir = "artifacts/flight-ticket-generator/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22365"
BASE_PATH = "/"
